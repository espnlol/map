# Rebuilds public/data/crashes.json from Wikidata/Wikipedia, commits it if
# anything changed, then republishes the website.
#
# GitHub only runs scheduled workflows from the repository's default branch,
# so the weekly schedule lives there (.github/workflows/scheduled-refreshes.yml
# on the default branch) and starts this one. It also runs when the importer
# changes, and any time from the Actions tab: "Refresh crash data" -> Run workflow.
name: Refresh crash data

on:
  workflow_dispatch:
  # Also rebuild whenever the importer itself changes. (This also lets GitHub
  # register the workflow, so the scheduler on the default branch can start it.)
  push:
    branches: [claude/zen-maxwell-46802a]
    paths:
      - scripts/build-crashes.mjs
      - scripts/crash-classify.mjs
      - scripts/infobox.mjs
      - .github/workflows/refresh-crashes.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-crashes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/zen-maxwell-46802a

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download every aviation accident from Wikidata
        run: node scripts/build-crashes.mjs

      - name: Commit if anything changed, then republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The file records the date it was built; ignore that line when comparing.
          if git diff --quiet -I '"updated"' -- public/data/crashes.json; then
            echo "Crash data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/data/crashes.json
          git commit -m "Refresh crash data from Wikipedia ($(date -u +%Y-%m-%d))"
          # If someone pushed while this ran, replay the data commit on top of theirs.
          for attempt in 1 2 3; do
            if git push origin HEAD:claude/zen-maxwell-46802a; then break; fi
            if [ "$attempt" = 3 ]; then echo "Could not push after 3 tries"; exit 1; fi
            if ! git pull --rebase origin claude/zen-maxwell-46802a; then
              git rebase --abort || true
              echo "The crash data changed on the branch while this ran; that commit's own refresh will cover it."
              exit 0
            fi
          done
          # pushes made by a workflow don't trigger other workflows, so start the publish one directly
          gh workflow run pages.yml --ref claude/zen-maxwell-46802a
