# Builds Black Box Atlas and publishes it to GitHub Pages every time this
# branch is updated. It lives in the crashes/ folder of the gh-pages branch,
# so it shows up at https://<owner>.github.io/<repo>/crashes/ next to
# SkyWatch (which owns the root of that branch). Only crashes/ is replaced.
name: Publish Black Box Atlas website

on:
  push:
    branches: [claude/zen-maxwell-46802a]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-crashes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for https://<owner>.github.io/<repo>/crashes/
        run: npx tsc --noEmit && npx vite build --base=/${{ github.event.repository.name }}/crashes/

      - name: Publish into gh-pages/crashes (keeping everything else)
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898699+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            rm -rf site
            status=0
            git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null || status=$?
            if [ "$status" = 0 ]; then
              git clone -q --depth 1 --branch gh-pages "$REPO_URL" site
            elif [ "$status" = 2 ]; then
              mkdir site && git -C site init -q -b gh-pages && git -C site remote add origin "$REPO_URL"
            else
              echo "Could not read the repository"; exit 1
            fi
            rm -rf site/crashes
            cp -r dist site/crashes
            touch site/.nojekyll
            cd site
            git add -A
            if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
            git commit -q -m "Publish Black Box Atlas from ${GITHUB_SHA::7}"
            if git push -q origin gh-pages; then exit 0; fi
            cd ..
            echo "Push raced with another publish; retrying ($attempt)"
            sleep $((attempt * 5))
          done
          exit 1
