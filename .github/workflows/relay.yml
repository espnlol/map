# Deploys worker/skywatch-relay.js to Cloudflare whenever it changes, so the
# relay never has to be copied and pasted by hand again.
#
# Off until a Cloudflare API token is saved as the repository secret
# CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions). Without
# it this workflow just says so and stops.
name: Deploy relay

on:
  push:
    branches: [claude/eager-mayer-5evp1u, main]
    paths: ['worker/**', '.github/workflows/relay.yml']
  workflow_dispatch:

concurrency:
  group: relay-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so the relay wasn't deployed. Paste it by hand, or add the secret to turn this on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Check the relay script
        if: steps.token.outputs.ready == 'true'
        run: node --check worker/skywatch-relay.js

      - name: Deploy with Wrangler
        if: steps.token.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
